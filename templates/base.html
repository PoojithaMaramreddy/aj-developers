{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AJ Developers{% endblock %}</title>

    <meta
        name="description"
        content="{% block meta_description %}AJ Developers - Developing Spaces, Enriching Lives.{% endblock %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="container nav-container">

            <a href="{% url 'home' %}" class="brand-logo">
                <img
                    src="{% static 'images/logo.png' %}"
                    alt="AJ Developers"
                >
            </a>

            <nav class="main-nav">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'projects' %}">
                    Projects
                </a>

                <a href="{% url 'home' %}#about">
                    About Us
                </a>

                <a href="{% url 'home' %}#contact">
                    Contact
                </a>

                <a
                    href="https://wa.me/918977914586"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="nav-whatsapp"
                    aria-label="WhatsApp AJ Developers"
                    title="WhatsApp AJ Developers"
                >
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <p>
                © {% now "Y" %} AJ Developers.
                Developing Spaces, Enriching Lives.
            </p>

        </div>

    </footer>


    <!-- Header Scroll Behaviour -->
    <script>
        window.addEventListener("scroll", function () {

            const header = document.querySelector(".site-header");

            if (!header) return;

            if (window.scrollY > 60) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }

        });
    </script>


    <!-- Subtle Cursor / Tap Sparkles -->
    <script>
        (() => {

            let lastSparkleTime = 0;

            function createSparkle(x, y) {

                const now = Date.now();

                // Prevent too many sparkles
                if (now - lastSparkleTime < 70) {
                    return;
                }

                lastSparkleTime = now;

                const sparkle = document.createElement("span");

                sparkle.className = "cursor-sparkle";

                sparkle.style.left = `${x}px`;
                sparkle.style.top = `${y}px`;

                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 700);

            }


            // Laptop / Desktop
            document.addEventListener("pointermove", function (event) {

                if (event.pointerType === "mouse") {

                    createSparkle(
                        event.clientX,
                        event.clientY
                    );

                }

            });


            // Phone / Tablet tap
            document.addEventListener("pointerdown", function (event) {

                if (
                    event.pointerType === "touch" ||
                    event.pointerType === "pen"
                ) {

                    createSparkle(
                        event.clientX,
                        event.clientY
                    );

                }

            });

        })();
    </script>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
